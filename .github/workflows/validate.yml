name: Validate frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check removed navigation references
        shell: bash
        run: |
          set -e
          if grep -R -nE 'clientes\.html|materiais\.html|assets/js/features/(clientes|materiais|produtos)/'             --exclude-dir=.git             --exclude='*.md'             .; then
            echo "Found references to removed screens/modules."
            exit 1
          fi

      - name: Check shared panel styling
        shell: bash
        run: |
          set -e
          pages="dashboard.html vendas.html compras.html receitas.html encomendas.html leads.html relatorios.html calculadora.html ajuda.html perfil.html estoque.html minha-loja.html minha-loja-editar.html editar-venda.html editar-encomenda.html"
          for page in $pages; do
            if ! grep -q 'assets/css/professional.css' "$page"; then
              echo "Missing professional.css in $page"
              exit 1
            fi
          done
