<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Kroche Manager</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Kroche Manager</h1>
        <p class="subtitulo">Entre para gerenciar seu ateliê</p>

        <div id="alerta" class="alerta"></div>

        <form id="form-login">
            <label class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control" required autofocus>

            <label class="form-label">Senha</label>
            <input type="password" id="senha" class="form-control" required>

            <button type="submit" class="btn-marrom" id="btn-entrar">Entrar</button>
        </form>

        <div class="auth-links">
            <a href="esqueci-senha.html">Esqueci minha senha</a>
            <br><br>
            Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseConfig.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-entrar");
        btn.disabled = true;
        btn.textContent = "Entrando...";

        await fazerLogin(
            document.getElementById("email").value,
            document.getElementById("senha").value
        );

        btn.disabled = false;
        btn.textContent = "Entrar";
    });
</script>
</body>
</html>
