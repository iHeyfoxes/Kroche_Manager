<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha - Kroche Manager</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="auth-simple"><main class="auth-card"><div class="auth-logo"><span>🧶</span><span>Kroche Manager</span></div><h1>Recuperar sua senha</h1><p class="subtitulo">Informe seu e-mail e enviaremos um link seguro para criar uma nova senha.</p><div id="alerta" class="alerta"></div><form id="form-recuperar"><label class="form-label">E-mail</label><input type="email" id="email" class="form-control" placeholder="voce@exemplo.com" autocomplete="email" required autofocus><button type="submit" class="btn-marrom" id="btn-enviar">Enviar link de recuperação</button></form><div class="auth-links"><a href="login.html">← Voltar para o login</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabaseConfig.js"></script><script src="assets/js/auth.js"></script><script>document.getElementById('form-recuperar').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn-enviar');b.disabled=true;b.textContent='Enviando...';await pedirRecuperacaoSenha(document.getElementById('email').value);b.disabled=false;b.textContent='Enviar link de recuperação'});</script></body></html>
