<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha - Kroche Manager</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="auth-simple"><main class="auth-card"><div class="auth-logo"><span>🧶</span><span>Kroche Manager</span></div><h1>Crie uma nova senha</h1><p class="subtitulo">Escolha uma senha com pelo menos 8 caracteres para proteger sua conta.</p><div id="alerta" class="alerta"></div><form id="form-reset"><label class="form-label">Nova senha</label><input type="password" id="senha" class="form-control" autocomplete="new-password" required minlength="8"><label class="form-label">Confirmar nova senha</label><input type="password" id="confirmar" class="form-control" autocomplete="new-password" required minlength="8"><button type="submit" class="btn-marrom" id="btn-salvar">Salvar nova senha</button></form><div class="auth-links"><a href="login.html">← Voltar para o login</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabaseConfig.js"></script><script src="assets/js/auth.js"></script><script>(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){mostrarAlerta('alerta','erro','Este link de recuperação é inválido ou expirou. Solicite um novo link na tela de recuperação.');document.getElementById('form-reset').style.display='none'}})();document.getElementById('form-reset').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn-salvar');b.disabled=true;b.textContent='Salvando...';await redefinirSenha(document.getElementById('senha').value,document.getElementById('confirmar').value);b.disabled=false;b.textContent='Salvar nova senha'});</script></body></html>
